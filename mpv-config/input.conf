# D-FLIX mpv keys (mpv ke baaki default keys bhi chalte hain: SPACE=pause, f=fullscreen, j=subtitle, #=audio track,
# [ ] = speed, 9/0 = volume, LEFT/RIGHT = 5s seek, UP/DOWN = 60s seek, m=mute, v=sub on/off, i=info)
> script-message dflix-next
< script-message dflix-prev
N script-message dflix-next
P script-message dflix-prev
q script-message dflix-quality
Q script-message dflix-quality
Ctrl+q quit
ENTER cycle pause
KP_ENTER cycle pause
MBTN_LEFT_DBL cycle fullscreen
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
